name: Hourly bug fix notification

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-bugs
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Rebuild data/bugs.json from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_bugs.py

      - name: Send the status to the phone
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_ONLY_ON_CHANGE: ${{ vars.NOTIFY_ONLY_ON_CHANGE }}
        run: python3 scripts/notify.py

      - name: Save the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notify_state.json data/bugs.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update notification snapshot"
          git pull --rebase --quiet
          git push
